    <text x="1280" y="640" fill="#8fb6d6" font-size="19" font-weight="700" letter-spacing="2">CUSTOMER</text>

    <rect x="1380" y="550" width="190" height="120" rx="8" fill="#223247" stroke="#86a6c2" stroke-width="3"/>
    <text x="1475" y="602" fill="#ffffff" font-size="22" font-weight="700">DETAIL</text>
    <text x="1475" y="635" fill="#8fb6d6" font-size="15" font-weight="650">DRILLTHROUGH</text>

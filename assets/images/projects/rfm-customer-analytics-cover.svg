    <text x="120" y="540" fill="#dce5ed" font-size="26" font-weight="600">Power BI · DAX · RFM</text>
    <text x="120" y="610" fill="#8fb6d6" font-size="24" font-weight="650">Recency · Frequency · Monetary · Drillthrough</text>
